syntax = "proto2";

package maps_tactile.shared;

import "maps/tactile/api/shared/geometry-3d.proto";
import "maps/tactile/api/shared/geometry.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option objc_class_prefix = "GMTTSH";
option java_multiple_files = true;
option java_outer_classname = "AugmentedRealityGeometryProto";
option java_package = "com.google.maps.tactile.shared";

message AugmentedRealityGeometry {
    repeated DataTag tag_set = 1;
    message DataTag {
        optional string tag = 1;
    }
    
    optional LatLng origin = 2;
    optional double origin_altitude_meters_above_wgs84 = 3;
    optional int32 terrain_epoch = 4;
    
    repeated Payload payload = 5;
    message Payload {
        oneof type {
            Point3dWithNormal point_with_normal = 1;
            Point3d point = 2;
        }
    }
    
    reserved 6;
}

message AugmentedRealityGeometrySet {
    repeated AugmentedRealityGeometry geometry = 1;
}
