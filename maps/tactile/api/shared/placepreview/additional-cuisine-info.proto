syntax = "editions";

package maps_tactile.shared.placepreview;

import "storage/datapol/annotations/proto/semantic_annotations.proto";
import "third_party/java/protobuf/java_features.proto";
import "third_party/protobuf/cpp_features.proto";

option features = field_presence: EXPLICIT
enum_type: CLOSED
;
option objc_class_prefix = "GMTTSHPP";
option java_multiple_files = true;
option java_outer_classname = "AdditionalCuisineInfoProto";
option java_package = "com.google.maps.tactile.shared.placepreview";

message AdditionalCuisineInfo {
    repeated AdditionalCuisine additional_cuisine = 1;
    message AdditionalCuisine {
        optional string name = 1;
    }
}
