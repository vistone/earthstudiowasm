syntax = "proto2";

package maps_tactile.directions;

import "maps/tactile/api/shared/parking.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option objc_class_prefix = "GMTTD";
option java_multiple_files = true;
option java_outer_classname = "ParkingPlannerProto";
option java_package = "com.google.maps.tactile.directions";

message ParkingPlanner {
    optional maps_tactile.shared.Parking parking = 2 [deprecated = true];
    
    reserved 1, 3, 4, 5, 6;
}
