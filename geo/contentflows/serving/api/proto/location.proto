syntax = "editions";

package geo_contentflows_serving;

import "google/geo/type/viewport.proto";
import "google/type/latlng.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "LocationProto";
option java_package = "com.google.geo.contentflows";

message Circle {
    optional google.type.LatLng center = 1;
    optional float radius = 2;
}

message Region {
    oneof region {
        google.geo.type.Viewport viewport = 2;
        Circle circle = 3;
        uint64 s2_cell = 4;
    }
    
    reserved 1;
}

message Location {
    optional google.type.LatLng coordinates = 1;
    optional Elevation elevation = 2;
}

message Elevation {
    optional float elevation_meters_above_egm96 = 1;
    optional float elevation_meters_above_ground = 2;
    optional float elevation_meters_above_wgs84 = 3;
}

message Rotation {
    optional float heading = 1;
    optional float tilt = 2 [default = 90];
    optional float roll = 3;
}
