syntax = "editions";

package geotracker;

option java_package = "com.google.geo.imagery.geotracker.proto";

message GeometryProto {
    oneof representation {
        bytes encoded_s2_polygon = 1;
        uint64 s2_cell_id = 2;
        bytes encoded_s2_polyline = 3;
        bytes encoded_s2_cap = 4;
        CompositeGeometryProto composite_geometry = 5;
    }
}

message CompositeGeometryProto {
    repeated uint64 s2_cell_ids = 1;
    repeated bytes encoded_s2_polylines = 2;
}
