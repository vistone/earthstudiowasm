syntax = "editions";

package geo.imagery.karto.proto;

option features = utf8_validation: NONE
;
option java_multiple_files = true;

message AudioConfig {
    optional double speaking_rate = 1;
    optional double pitch = 2;
    optional double volume_gain_db = 3;
    optional int32 sample_rate_hertz = 4;
    repeated string effects_profile_id = 5;
}

message VoiceSelectionParams {
    optional string language_code = 1;
    optional string name = 2;
    optional string ssml_gender = 3;
}

message TimepointConfig {
    optional string timepoint_type = 1;
    optional int32 every_k_words = 2;
}

message CloudTtsOptions {
    optional AudioConfig audio_config = 1;
    optional VoiceSelectionParams voice_selection_params = 2;
    optional TimepointConfig timepoint_config = 3;
    
    optional Version version = 4;
    enum Version {
        VERSION_UNSPECIFIED = 0;
        V1 = 1;
        V1BETA1 = 2;
    }
}

message Timepoints {
    repeated Timepoint timepoints = 1;
    message Timepoint {
        optional string mark_name = 1;
        optional double time_seconds = 2;
    }
}
