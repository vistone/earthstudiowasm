syntax = "proto2";

package earth.document;

import "geo/earth/proto/storage_restrictions.proto";

option csharp_namespace = "Google.Geo.Earth.Document";
option objc_class_prefix = "RTH";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_outer_classname = "IconProto";
option java_package = "com.google.android.apps.earth.document";

message ProtoRequiresAtLeastOneMessageInFileIcon {
    
}

enum Icon {
    ICON_UNKNOWN = 0;
    ICON_MAP = 1;
    ICON_NETWORK_LINK = 2;
    ICON_DEFAULT_DOCUMENT = 3;
}
