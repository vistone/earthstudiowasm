syntax = "editions";

package earth.documentstatus;

import "devtools/staticanalysis/pipeline/analyzers/proto_best_practices/proto/optouts.proto";
import "geo/earth/app/cpp/core/protos/localized_message.proto";
import "google/protobuf/timestamp.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "DocumentStatusProto";
option java_package = "com.google.android.apps.earth.documentstatus";

message DocumentStatus {
    optional string id = 1;
    optional DocumentOperation document_operation = 2;
    optional bool is_activity_cancellation_available = 3;
}

message DocumentOperation {
    optional Status status = 1;
    optional string name = 2;
    optional google.protobuf.Timestamp start_time = 3;
    optional FailureSource failure_source = 4;
    optional .earth.core.LocalizedMessage failure_message_title = 5;
    optional .earth.core.LocalizedMessage failure_message = 6;
    optional int32 max_activity_duration_minutes = 7;
    optional DocumentOperationType document_operation_type = 8;
}

message DocumentStatuses {
    repeated DocumentStatus document_statuses = 1;
}

enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_NOT_STARTED = 1;
    STATUS_PENDING_DOCUMENT_CREATION = 2;
    STATUS_IN_PROGRESS = 3;
    STATUS_COMPLETED = 4;
    STATUS_CANCELLED = 5;
    STATUS_FAILED = 6;
}

enum FailureSource {
    FAILURE_SOURCE_UNKNOWN = 0;
    FAILURE_SOURCE_INTERNAL = 1;
    FAILURE_SOURCE_BACKEND_COMMUNICATION = 2;
    FAILURE_SOURCE_REQUEST_TIMED_OUT = 3;
    FAILURE_SOURCE_IMPORT = 4;
    FAILURE_SOURCE_IMPORT_NO_FEATURES = 5;
}

enum DocumentOperationType {
    DOCUMENT_OPERATION_TYPE_UNKNOWN = 0;
    DOCUMENT_OPERATION_TYPE_CONTOUR_ANALYSIS = 1;
    DOCUMENT_OPERATION_TYPE_SLOPE_ANALYSIS = 2;
    DOCUMENT_OPERATION_TYPE_ASPECT_ANALYSIS = 3;
    DOCUMENT_OPERATION_TYPE_CUT_AND_FILL_ANALYSIS = 4;
}
