syntax = "editions";

package earth.state.derivedstate;

import "devtools/staticanalysis/pipeline/analyzers/proto_best_practices/proto/optouts.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option objc_class_prefix = "RTH";
option optimize_for = CODE_SIZE;
option java_outer_classname = "Buildingtemplatesmanagerderivedstate";
option java_package = "com.google.geo.earth.app.cpp.state.derivedstate";

message BuildingTemplatesManagerDerivedState {
    optional int32 document_key = 1 [default = -1];
    optional bool ums_persisted = 2;
}
