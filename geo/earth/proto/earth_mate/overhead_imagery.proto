syntax = "proto2";

package geo.earth.proto;

import "geo/earth/proto/earth_mate/image.proto";
import "google/protobuf/timestamp.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.google.geo.earth.proto";

message OverheadImageryProperties {
    optional Image image = 1;
    optional google.protobuf.Timestamp acquisition_time = 2;
}
